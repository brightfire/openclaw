# Upgrade Stable
#
# Creates a new stable branch from a fresh upstream tag and replays all
# active patches on top of it. The brightfire/* branches are rebased onto
# the new upstream tag as part of the process.
#
# Manual trigger only — requires user to confirm the new upstream tag.

name: "BF: Upgrade Stable"

on:
  workflow_dispatch:
    inputs:
      new_upstream_tag:
        description: 'New upstream tag (e.g. v2026.6.0)'
        required: true
        type: string
      old_upstream_tag:
        description: 'Previous upstream tag that current stable is based on (e.g. v2026.5.7)'
        required: true
        type: string

env:
  PATCHES_FILE: BRIGHTFIRE_PATCHES.md

permissions:
  contents: write

jobs:
  upgrade:
    name: Upgrade stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.BF_CI_APP_ID }}
          private-key: ${{ secrets.BF_CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "brightfire-ci"
          git config user.email "ci@brightfire.net"

      - name: Install tools
        run: npm install -g pnpm

      - name: Stage patch parser
        run: cp scripts/bf/parse-patches.py /tmp/parse-patches.py

      - name: Ensure upstream remote
        run: |
          ORIGIN_URL=$(git remote get-url origin)
          UPSTREAM_URL=$(echo "$ORIGIN_URL" | sed 's|brightfire/openclaw|openclaw/openclaw|')
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --force upstream

      - name: Verify new upstream tag
        run: |
          TAG="v${{ inputs.new_upstream_tag }}"
          TAG="${TAG#v}"
          TAG="v$TAG"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Upstream tag $TAG not found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        id: tag

      - name: Fetch brightfire branches
        run: git fetch origin '+refs/heads/brightfire/*:refs/remotes/origin/brightfire/*'

      - name: Parse active patches
        id: patches
        run: python3 /tmp/parse-patches.py "$PATCHES_FILE" "$GITHUB_OUTPUT"

      - name: Rebase each brightfire branch onto new upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ steps.tag.outputs.tag }}"
          FAILED_BRANCHES=""

          IFS=',' read -ra PATCHES <<< "${{ steps.patches.outputs.list }}"
          for PATCH in "${PATCHES[@]}"; do
            PATCH=$(echo "$PATCH" | xargs)
            PATCH_BRANCH="brightfire/$PATCH"

            echo ""
            echo "=== Rebasing $PATCH_BRANCH onto $NEW_TAG ==="

            # Checkout the brightfire branch locally
            git checkout -B "$PATCH_BRANCH" "origin/$PATCH_BRANCH"

            # Rebase onto the new upstream tag
            if git rebase "$NEW_TAG" --no-verify 2>&1; then
              echo "SUCCESS: $PATCH_BRANCH rebased onto $NEW_TAG"
              git push --force-with-lease origin "$PATCH_BRANCH" --no-verify
              echo "Pushed updated $PATCH_BRANCH"
            else
              echo "FAILURE: $PATCH_BRANCH failed to rebase onto $NEW_TAG"
              echo "Conflicts need manual resolution"
              git rebase --abort 2>/dev/null || true
              FAILED_BRANCHES="${FAILED_BRANCHES} ${PATCH_BRANCH}"
            fi
          done

          if [ -n "$FAILED_BRANCHES" ]; then
            echo "::error::The following branches failed to rebase onto $NEW_TAG:$FAILED_BRANCHES"
            echo "Resolve conflicts locally and push the updated brightfire branches, then retry."
            exit 1
          fi

          # Go back to default branch
          git checkout -

      - name: Create new stable branch
        run: |
          NEW_TAG="${{ steps.tag.outputs.tag }}"
          STABLE_BRANCH="stable/${{ steps.tag.outputs.version }}"

          git checkout -b "$STABLE_BRANCH" "$NEW_TAG"

          # Delete old remote stable if it exists
          if git ls-remote --exit-code --heads origin "$STABLE_BRANCH" 2>/dev/null; then
            git push origin --delete "$STABLE_BRANCH" || true
          fi
          echo "Created new $STABLE_BRANCH from $NEW_TAG"

      - name: Merge patches in order
        run: |
          IFS=',' read -ra PATCHES <<< "${{ steps.patches.outputs.list }}"
          for PATCH in "${PATCHES[@]}"; do
            PATCH=$(echo "$PATCH" | xargs)
            PATCH_BRANCH="brightfire/$PATCH"

            echo "=== Merging $PATCH_BRANCH ==="
            if git merge --squash "origin/$PATCH_BRANCH" 2>&1; then
              git commit --no-verify -m "ci: apply $PATCH_BRANCH" 2>&1
              echo "SUCCESS: $PATCH_BRANCH"
            else
              git reset --hard HEAD
              echo "::error::Merge conflict applying $PATCH_BRANCH"
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Pre-push checks
        run: pnpm prepush:ci 2>/dev/null || pnpm tsgo

      - name: Run tests
        run: pnpm vitest run --reporter=basic 2>/dev/null || echo "Tests non-blocking for upgrade"

      - name: Update package.json version
        run: |
          VERSION="${{ steps.tag.outputs.version }}-bf1"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');
          "
          git add package.json
          git commit --no-verify -m "ci: bump version after upgrade to $VERSION"

      - name: Push stable branch
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STABLE_BRANCH="stable/${{ steps.tag.outputs.version }}"
          git push origin "$STABLE_BRANCH"
          echo "Pushed $STABLE_BRANCH"

      - name: Update upstream pin in BRIGHTFIRE_PATCHES.md (brightfire/ci)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The pin in BRIGHTFIRE_PATCHES.md _meta is the SINGLE source of truth
          # for which upstream version build-stable rebuilds against. After a
          # successful upgrade we must update it on brightfire/ci, otherwise the
          # next build-stable run will still rebuild against the previous pin.
          WORK=$(mktemp -d)
          git clone --depth 1 --branch brightfire/ci "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          cd "$WORK"
          git config user.name "brightfire-ci"
          git config user.email "ci@brightfire.net"
          python3 scripts/bf/update-upstream-pin.py BRIGHTFIRE_PATCHES.md "$NEW_TAG"
          if git diff --quiet BRIGHTFIRE_PATCHES.md; then
            echo "No pin change needed (already $NEW_TAG)"
          else
            git add BRIGHTFIRE_PATCHES.md
            git commit --no-verify -m "ci: bump upstream pin to $NEW_TAG"
            git push origin brightfire/ci
            echo "Bumped manifest pin to $NEW_TAG on brightfire/ci"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "bf/v${{ steps.tag.outputs.version }}-bf1"
          name: "Brightfire v${{ steps.tag.outputs.version }}-bf1 (upgrade)"
          body: |
            Upgraded from upstream `${{ inputs.old_upstream_tag }}` to `${{ steps.tag.outputs.tag }}`
            Active patches applied: ${{ steps.patches.outputs.list }}
          target_commitish: "stable/${{ steps.tag.outputs.version }}"

      - name: Build and attach tarball
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          TAG="bf/v${VERSION}-bf1"
          NODE_OPTIONS="--max-old-space-size=6000" pnpm build
          pnpm ui:build
          npm pack --ignore-scripts
          TARBALL=$(ls openclaw-*.tgz 2>/dev/null | head -1)
          if [ -n "$TARBALL" ]; then
            gh release upload "$TAG" "$TARBALL"
            echo "Uploaded: $TARBALL"
          fi
