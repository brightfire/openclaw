# Build Stable
#
# Rebuilds the stable branch by creating it fresh from an upstream tag
# and merging all active brightfire/* patch branches in manifest order.
# Then tags the result and creates a GitHub Release with the built tarball.
#
# Triggered automatically on push to brightfire/ci when BRIGHTFIRE_PATCHES.md
# or this workflow changes. Manual dispatch otherwise.
# Only one run executes at a time — new runs queue and cancel prior runs.

name: "BF: Build Stable"

on:
  push:
    branches:
      - 'brightfire/ci'
    paths:
      - 'BRIGHTFIRE_PATCHES.md'
      - '.github/workflows/bf-build-stable.yml'
      - 'scripts/bf/parse-patches.py'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to build from (e.g. v2026.5.7). Defaults to latest.'
        required: false
        type: string

env:
  PATCHES_FILE: BRIGHTFIRE_PATCHES.md

permissions:
  contents: write

concurrency:
  group: build-stable
  cancel-in-progress: true

jobs:
  rebuild-stable:
    name: Rebuild stable
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.BF_CI_APP_ID }}
          private-key: ${{ secrets.BF_CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Fetch patch manifest from brightfire/ci
        run: |
          git show origin/brightfire/ci:BRIGHTFIRE_PATCHES.md > BRIGHTFIRE_PATCHES.md
          echo "Loaded patch manifest from brightfire/ci"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: npm install -g pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Stage patch parser
        run: cp scripts/bf/parse-patches.py /tmp/parse-patches.py

      - name: Parse manifest (patches + upstream pin)
        id: patches
        run: |
          python3 /tmp/parse-patches.py "$PATCHES_FILE" "$GITHUB_OUTPUT"

      - name: Determine upstream tag
        id: upstream-tag
        run: |
          # Resolution order (no auto-detect, no silent fallbacks):
          #   1. workflow_dispatch input  (ad-hoc test build during an upgrade)
          #   2. BRIGHTFIRE_PATCHES.md _meta `Upstream version` pin
          # If neither is set, fail loudly. Bumping the pin is the job of the
          # BF: Upgrade workflow — build-stable never decides the target version.
          INPUT_TAG="${{ inputs.upstream_tag }}"
          MANIFEST_TAG="${{ steps.patches.outputs.upstream_version }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            SOURCE="workflow_dispatch input"
          elif [ -n "$MANIFEST_TAG" ]; then
            TAG="$MANIFEST_TAG"
            SOURCE="BRIGHTFIRE_PATCHES.md _meta pin"
          else
            echo "::error::No upstream tag resolved. Add an `Upstream version` to the _meta section of BRIGHTFIRE_PATCHES.md, or pass inputs.upstream_tag explicitly."
            exit 1
          fi
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Resolved upstream tag '$TAG' (from $SOURCE) is not vX.Y.Z; refusing to continue."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "Resolved upstream tag: $TAG (version=$VERSION, source=$SOURCE)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure upstream remote
        run: |
          ORIGIN_URL=$(git remote get-url origin 2>/dev/null || echo "")
          if echo "$ORIGIN_URL" | grep -q brightfire; then
            UPSTREAM_URL=$( echo "$ORIGIN_URL" | sed 's|brightfire/openclaw|openclaw/openclaw|' )
            git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
            git fetch --force --tags upstream
          fi

      - name: Compute version suffix
        id: version
        run: |
          VERSION="${{ steps.upstream-tag.outputs.version }}"
          # Tag format: bf/v{VERSION}-bf{N}
          # The bf/ prefix prevents upstream workflows (e.g. docker-release.yml)
          # from triggering on our tags — they match on `v*` which would fire
          # on bare v{VERSION}-bf{N} tags. The -bf{N} suffix is kept to match
          # the package.json version.
          BF_NUM=$(git tag -l "bf/v${VERSION}-bf*" | sed -E 's/.*-bf([0-9]+)/\1/' | sort -n | tail -1)
          if [ -z "$BF_NUM" ]; then
            BF_NUM=1
          else
            BF_NUM=$((BF_NUM + 1))
          fi
          echo "bf=bf${BF_NUM}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}-bf${BF_NUM}" >> "$GITHUB_OUTPUT"
          echo "tag=bf/v${VERSION}-bf${BF_NUM}" >> "$GITHUB_OUTPUT"

      - name: Create stable branch from upstream tag
        run: |
          TAG="${{ steps.upstream-tag.outputs.tag }}"
          STABLE_BRANCH="stable/${{ steps.upstream-tag.outputs.version }}"

          if git ls-remote --exit-code --heads upstream "$STABLE_BRANCH" 2>/dev/null; then
            git checkout -b "$STABLE_BRANCH" "upstream/$STABLE_BRANCH" 2>/dev/null || \
            git checkout -b "$STABLE_BRANCH" "$TAG"
          else
            git checkout -b "$STABLE_BRANCH" "$TAG"
          fi

          if git ls-remote --exit-code --heads origin "$STABLE_BRANCH" 2>/dev/null; then
            git push origin --delete "$STABLE_BRANCH" || true
          fi

          echo "Created stable branch: $STABLE_BRANCH"

      - name: Configure git
        run: |
          git config user.name "brightfire-ci"
          git config user.email "ci@brightfire.net"

      - name: Fetch all brightfire branches
        run: git fetch origin '+refs/heads/brightfire/*:refs/remotes/origin/brightfire/*'

      - name: Merge patches in order
        run: |
          IFS=',' read -ra PATCHES <<< "${{ steps.patches.outputs.list }}"
          STABLE_BRANCH="stable/${{ steps.upstream-tag.outputs.version }}"

          for PATCH in "${PATCHES[@]}"; do
            PATCH=$(echo "$PATCH" | xargs)
            PATCH_BRANCH="brightfire/$PATCH"

            echo ""
            echo "=== Merging $PATCH_BRANCH ==="

            if ! git ls-remote --exit-code --heads origin "$PATCH_BRANCH" 2>/dev/null; then
              echo "::warning::$PATCH_BRANCH not found on remote — skipping"
              continue
            fi

            if git merge --squash "origin/$PATCH_BRANCH" 2>&1; then
              git commit --no-verify -m "ci: apply $PATCH_BRANCH" 2>&1
              echo "SUCCESS: $PATCH_BRANCH"
            else
              git reset --hard HEAD
              echo "::error::Merge conflict applying $PATCH_BRANCH"
              exit 1
            fi
          done

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: upstream-${{ steps.upstream-tag.outputs.tag }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            upstream-${{ steps.upstream-tag.outputs.tag }}-pnpm-
            upstream-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Update package.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');
          "
          git add package.json
          git commit --no-verify -m "ci: bump version to $VERSION"

      - name: Regenerate build artifacts
        # Generated files are build output, not source. Patches must never
        # hand-edit them, and a clean-but-stale generated file on a patch
        # branch would otherwise ship in the tarball. Regenerate canonical
        # outputs from the merged sources here so the build is deterministic
        # regardless of what any patch branch contains. See SKILL.md "Patch
        # Discipline" rule 6 in the openclaw-dev skill for the full policy.
        run: |
          pnpm config:schema:gen
          pnpm protocol:gen
          pnpm protocol:gen:swift
          if ! git diff --quiet; then
            git add -A
            git commit --no-verify -m "ci: regenerate build artifacts on stable"
            echo "Regenerated build artifacts committed."
          else
            echo "No regenerated-artifact drift; nothing to commit."
          fi

      - name: Restore tsgo incremental cache
        uses: actions/cache@v4
        with:
          path: .artifacts/tsgo-cache/
          key: upstream-${{ steps.upstream-tag.outputs.tag }}-tsgo-${{ hashFiles('BRIGHTFIRE_PATCHES.md', 'tsconfig.core.json') }}
          restore-keys: |
            upstream-${{ steps.upstream-tag.outputs.tag }}-tsgo-

      - name: Pre-push checks
        run: pnpm prepush:ci 2>/dev/null || pnpm tsgo

      - name: Restore Vite UI build cache
        uses: actions/cache@v4
        with:
          path: |
            ui/node_modules/.vite/
            ui/dist/.vite/
          key: upstream-${{ steps.upstream-tag.outputs.tag }}-vite-${{ hashFiles('ui/package.json', 'pnpm-lock.yaml', 'ui/vite.config.ts') }}
          restore-keys: |
            upstream-${{ steps.upstream-tag.outputs.tag }}-vite-

      - name: Build tarball
        id: tarball
        run: |
          NODE_OPTIONS="--max-old-space-size=12000" pnpm build
          pnpm ui:build
          npm pack --ignore-scripts
          echo "tarball=$(ls openclaw-*.tgz | head -1)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: pnpm vitest run --reporter=basic 2>/dev/null || echo "Tests step completed (non-blocking)"

      - name: Push stable branch
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STABLE_BRANCH="stable/${{ steps.upstream-tag.outputs.version }}"
          git push --force origin "$STABLE_BRANCH"
          echo "Pushed $STABLE_BRANCH"

      - name: Tag stable build
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Brightfire ${{ steps.version.outputs.version }}"
          target_commitish: stable/${{ steps.upstream-tag.outputs.version }}
          draft: false
          files: ${{ steps.tarball.outputs.tarball }}
