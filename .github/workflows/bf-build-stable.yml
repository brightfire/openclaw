# Build Stable
#
# Rebuilds the stable branch by creating it fresh from origin/main
# and merging all active patch branches in manifest order.
# Patch branches use the <base-commit>/<patch-name> naming convention.
#
# Build always runs. Tests run by default (so we keep getting signal on
# patches still merging cleanly and tests still passing, and to keep upstream
# caches warm). Tests can be skipped via workflow_dispatch input skip_tests
# when a flaky CI runner or worker crash is blocking a needed release.
# Only the PUBLISH steps (push stable, tag, write fingerprint,
# create GitHub Release) gate on the manifest fingerprint: when the
# current BRIGHTFIRE_PATCHES.md sha256 matches the bf-build-fingerprint.json
# asset on the latest bf/v* release, publishing is skipped because the
# release would be byte-identical.
#
# Triggered automatically on push to brightfire/ci when BRIGHTFIRE_PATCHES.md
# or this workflow changes. Manual dispatch otherwise.
# Only one run executes at a time — new runs queue and cancel prior runs.

name: "BF: Build Stable"

on:
  push:
    branches:
      - "brightfire/ci"
    paths:
      - "BRIGHTFIRE_PATCHES.md"
      - ".github/workflows/bf-build-stable.yml"
      - "scripts/bf/**"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Tag and release even if manifest is unchanged"
        required: false
        type: boolean
        default: false
      skip_tests:
        description: "Skip the test suite (build + publish only)"
        required: false
        type: boolean
        default: false

env:
  PATCHES_FILE: BRIGHTFIRE_PATCHES.md
  # Disable pnpm's verifyDepsBeforeRun for the entire workflow. The version
  # bump changes package.json after setup-node-env installs deps; without
  # this, pnpm treats deps as stale and auto-installs with lifecycle scripts
  # that spawn orphan processes, hanging the runner.
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

permissions:
  contents: write

concurrency:
  group: build-stable
  cancel-in-progress: true

jobs:
  rebuild-stable:
    name: Rebuild stable
    runs-on: ubuntu-latest-xl
    # No timeout — bundle-all-plugins increases build time significantly
    # and we have no successful baseline run for this upstream version yet
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.BF_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.BF_CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # Pin the manifest used by this run: stage it to the working tree AND
      # save a frozen copy under /tmp + record its sha256 to GITHUB_ENV. Every
      # later step (parse, fingerprint gate, fingerprint writer) reads from
      # the pinned copy, not origin/brightfire/ci, so concurrent pushes to
      # brightfire/ci during build/test can't move the gate out from under us.
      - name: Fetch patch manifest from brightfire/ci (pinned)
        id: pin-manifest
        run: |
          git show origin/brightfire/ci:BRIGHTFIRE_PATCHES.md > BRIGHTFIRE_PATCHES.md
          cp BRIGHTFIRE_PATCHES.md /tmp/BRIGHTFIRE_PATCHES.pinned.md
          MANIFEST_SHA=$(sha256sum /tmp/BRIGHTFIRE_PATCHES.pinned.md | awk '{print $1}')
          echo "Pinned manifest sha256: $MANIFEST_SHA"
          echo "PINNED_MANIFEST_PATH=/tmp/BRIGHTFIRE_PATCHES.pinned.md" >> "$GITHUB_ENV"
          echo "PINNED_MANIFEST_SHA256=$MANIFEST_SHA" >> "$GITHUB_ENV"

      - name: Stage patch parser
        run: cp scripts/bf/parse-patches.py /tmp/parse-patches.py

      - name: Stage build-stable scripts
        run: |
          cp -r scripts/bf/build-stable /tmp/bf-build-stable
          chmod +x /tmp/bf-build-stable/*.sh

      - name: Parse manifest (patches + base branch)
        id: patches
        run: |
          python3 /tmp/parse-patches.py "$PATCHES_FILE" "$GITHUB_OUTPUT"

      # Read the version from package.json on the base branch (default: main).
      # The base branch is read from BRIGHTFIRE_PATCHES.md _meta.
      - name: Read version from base branch
        id: upstream-version
        env:
          BASE_BRANCH: ${{ steps.patches.outputs.base_branch }}
        run: |
          git fetch origin "$BASE_BRANCH"
          VERSION=$(git show "origin/$BASE_BRANCH:package.json" | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from package.json on origin/$BASE_BRANCH"
            exit 1
          fi
          echo "Version from origin/$BASE_BRANCH: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare stable branch
        env:
          VERSION: ${{ steps.upstream-version.outputs.version }}
          BASE_BRANCH: ${{ steps.patches.outputs.base_branch }}
          BASE_COMMIT: ${{ steps.patches.outputs.base_commit }}
        run: /tmp/bf-build-stable/prepare-stable-branch.sh

      - name: Compute version suffix
        id: version
        env:
          VERSION: ${{ steps.upstream-version.outputs.version }}
        run: /tmp/bf-build-stable/compute-bf-version.sh

      - name: Configure git
        run: |
          git config user.name "brightfire-ci"
          git config user.email "ci@brightfire.net"

      - name: Fetch all branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Merge patches in order
        env:
          PATCHES: ${{ steps.patches.outputs.list }}
          VERSION: ${{ steps.upstream-version.outputs.version }}
        run: /tmp/bf-build-stable/merge-patches.sh

      # Bump version BEFORE pnpm install so node_modules matches the final
      # package.json state, eliminating unnecessary auto-installs.
      - name: Update package.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: /tmp/bf-build-stable/bump-package-version.sh

      # Generate a ## {VERSION} CHANGELOG section from the pinned patch
      # manifest and inject it before the first upstream heading. Each patch
      # is listed with its name and the SHA that was actually merged into
      # stable, resolved from origin/<canonical-branch> via git rev-parse.
      # Reading from git (after fetch-all-brightfire-branches) rather than
      # the manifest Branch HEAD column ensures the link matches what
      # merge-patches.sh actually incorporated, even when the manifest is
      # ahead of or behind the live branch tip.
      - name: Inject brightfire CHANGELOG entry
        env:
          BF_VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_VERSION: ${{ steps.upstream-version.outputs.version }}
          REPO: https://github.com/brightfire/openclaw
        run: |
          python3 - << 'PYEOF'
          import os, re, subprocess, sys

          version  = os.environ['BF_VERSION']
          upstream = os.environ['UPSTREAM_VERSION']
          repo     = os.environ['REPO']
          manifest = '/tmp/BRIGHTFIRE_PATCHES.pinned.md'
          changelog = 'CHANGELOG.md'

          # Parse patch table: Name | Canonical branch | Branch HEAD | ...
          # We read name (cols[0]) and canonical branch (cols[1]); the
          # Branch HEAD column (cols[2]) is intentionally ignored — instead
          # we resolve the SHA live from the fetched remote ref so the
          # CHANGELOG always links what merge-patches.sh actually merged.
          entries = []
          in_table = False
          with open(manifest) as f:
              for line in f:
                  line = line.rstrip()
                  if line.startswith('| Name'):
                      in_table = True
                      continue
                  if not in_table:
                      continue
                  if not line.startswith('|'):
                      break
                  if re.match(r'^\|[-| ]+\|\s*$', line):
                      continue  # separator row
                  cols = [c.strip() for c in line.split('|')[1:-1]]
                  if len(cols) < 2:
                      continue
                  name = cols[0].strip()
                  branch = cols[1].strip()
                  # Strip markdown code formatting — the manifest template
                  # wraps canonical branch cells in backticks, e.g.
                  # `0a6c013be5f/example`. parse-patches.py uses a regex for
                  # the same reason; mirror that here so git rev-parse gets
                  # the bare branch name rather than the backtick-wrapped one.
                  branch = re.sub(r'^`(.+)`$', r'\1', branch)
                  if name and branch:
                      entries.append((name, branch))

          if not entries:
              print(f'No patches found in {manifest}', file=sys.stderr)
              sys.exit(1)

          # Resolve each patch's actual merged SHA from the fetched remote ref.
          patches = []
          for name, branch in entries:
              ref = f'origin/{branch}'
              result = subprocess.run(
                  ['git', 'rev-parse', ref],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  print(f'WARNING: could not resolve {ref}: {result.stderr.strip()}', file=sys.stderr)
                  continue
              sha = result.stdout.strip()[:10]
              patches.append((name, sha))

          if not patches:
              print('No patch SHAs could be resolved from git refs', file=sys.stderr)
              sys.exit(1)

          # Build the section
          section_lines = [
              f'## {version}',
              '',
              f'Brightfire build on upstream {upstream}.',
              '',
              '### Patches',
              '',
          ]
          for name, sha in patches:
              section_lines.append(f'- **{name}** \u2014 [`{sha}`]({repo}/commit/{sha})')
          section_lines.append('')
          section = '\n'.join(section_lines) + '\n'

          # Read changelog and check for existing entry
          with open(changelog) as f:
              content = f.read()

          marker = f'## {version}'
          if re.search(r'^' + re.escape(marker) + r'(\s|$)', content, re.MULTILINE):
              print(f'CHANGELOG already contains entry for {version}', file=sys.stderr)
              sys.exit(0)

          # Inject before the first ## heading
          m = re.search(r'^## ', content, re.MULTILINE)
          if m:
              content = content[:m.start()] + section + '\n' + content[m.start():]
          else:
              content = section + '\n' + content

          with open(changelog, 'w') as f:
              f.write(content)

          print(f'Injected CHANGELOG entry for {version} ({len(patches)} patches)', file=sys.stderr)
          PYEOF

      # Reuse upstream's composite so pnpm install + store-cache run the same
      # way upstream CI does. We set install-deps=false and run pnpm install
      # ourselves because the upstream action hardcodes CI=true, which makes
      # pnpm default to --frozen-lockfile even when frozen-lockfile=false.
      # The version bump + patch merges change package.json, so the lockfile
      # needs to update during install.
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24"
          install-bun: "false"
          cache-mode: "restore"
          install-deps: "false"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Regenerate build artifacts
        run: /tmp/bf-build-stable/regenerate-artifacts.sh

      # Both incremental caches restored together before any compute begins,
      # so neither the lint phase nor the build phase ever starts cold.
      - name: Restore tsgo incremental cache
        uses: actions/cache@v5
        with:
          path: .artifacts/tsgo-cache/
          key: upstream-v${{ steps.upstream-version.outputs.version }}-tsgo-${{ hashFiles('BRIGHTFIRE_PATCHES.md', 'tsconfig.core.json') }}
          restore-keys: |
            upstream-v${{ steps.upstream-version.outputs.version }}-tsgo-

      - name: Restore Vite UI build cache
        uses: actions/cache@v5
        with:
          path: |
            ui/node_modules/.vite/
            ui/dist/.vite/
          key: upstream-v${{ steps.upstream-version.outputs.version }}-vite-${{ hashFiles('ui/package.json', 'pnpm-lock.yaml', 'ui/vite.config.ts') }}
          restore-keys: |
            upstream-v${{ steps.upstream-version.outputs.version }}-vite-

      # Lint and build run concurrently. The check commands mirror upstream
      # CI's individual shards (not the `pnpm check` aggregate, which runs a
      # superset including checks upstream CI doesn't gate on — e.g.
      # check:temp-path-guardrails is broken on upstream main). Check +
      # typecheck + lint + format are read-only source analysis. Build writes
      # to dist/. No shared paths, safe to overlap.
      - name: Lint and build
        run: |
          # --- Check shard (mirrors upstream CI `guards` shard) ---
          (
            pnpm check:no-conflict-markers &&
            pnpm check:doctor-deprecation-registry &&
            pnpm tool-display:check &&
            pnpm check:host-env-policy:swift &&
            pnpm dup:check &&
            pnpm check:coercion-helpers &&
            pnpm deps:patches:check &&
            pnpm lint:webhook:no-low-level-body-read &&
            pnpm lint:auth:no-pairing-store-group &&
            pnpm lint:auth:pairing-account-scope &&
            pnpm check:import-cycles &&
            # Typecheck (mirrors upstream CI prod-types + scripts + test root)
            pnpm tsgo:prod &&
            pnpm tsgo:scripts &&
            pnpm tsgo:test:root &&
            # Lint + format (mirrors upstream CI lint shard)
            pnpm lint &&
            pnpm format:check &&
            # npm package-lock guard (mirrors upstream CI npm-lock shard)
            pnpm deps:npm-lock:check &&
            # Bundled channel config metadata
            pnpm check:bundled-channel-config-metadata
          ) & CHECK_PID=$!

          pnpm lint:ui:no-raw-window-open & UI_LINT_PID=$!
          NODE_OPTIONS="--max-old-space-size=12000" pnpm build & BUILD_PID=$!

          FAIL=0
          wait "$CHECK_PID"   || { echo "=== FAILED: check shard ===" >&2;                     FAIL=1; }
          wait "$UI_LINT_PID"  || { echo "=== FAILED: pnpm lint:ui:no-raw-window-open ===" >&2; FAIL=1; }
          wait "$BUILD_PID"    || { echo "=== FAILED: pnpm build ===" >&2;                      FAIL=1; }
          [ "$FAIL" -eq 0 ]

      # Tests run in the foreground. Release-check and tarball pack run in the
      # background concurrently — neither depends on test results, both depend
      # only on the already-complete build. Outputs (needs_release,
      # manifest_sha256, tarball) are written to $GITHUB_OUTPUT by the
      # background scripts and are available to subsequent steps via
      # steps.run-tests.outputs.*.
      #
      # Note on PINNED_MANIFEST_PATH / PINNED_MANIFEST_SHA256: these are set
      # via $GITHUB_ENV in the pin-manifest step and are inherited by all
      # subsequent steps automatically — do NOT re-declare them here via
      # ${{ env.* }} as that would overwrite them with empty strings.
      - name: Run tests
        id: run-tests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          OPENCLAW_VITEST_MAX_WORKERS: "2"
          OPENCLAW_TEST_PROJECTS_LEAF_SHARDS: "1"
          OPENCLAW_TEST_PROJECTS_PARALLEL: "8"

          # Required by check-release-needed.sh (runs in background below).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force_release || 'false' }}
          # PINNED_MANIFEST_PATH and PINNED_MANIFEST_SHA256 are inherited from
          # the runner environment, written via $GITHUB_ENV in the pin-manifest
          # step above. Do NOT re-declare them here via ${{ env.* }} --
          # the workflow `env` context does not include vars set through
          # $GITHUB_ENV, so doing so would overwrite the inherited values with
          # empty strings and force check-release-needed.sh into its
          # origin/brightfire/ci fallback, defeating the whole point of
          # pinning the manifest source.
        run: |
          # Release-need check: manifest sha256 compare + one GitHub API call.
          # No dependency on test results — start immediately.
          /tmp/bf-build-stable/check-release-needed.sh & RELEASE_CHECK_PID=$!

          # Tarball pack: generates dist/postinstall-inventory.json (skipped by
          # --ignore-scripts) then packs the already-built dist/ tree (~10 s).
          # No dependency on test results — start immediately.
          # --ignore-scripts prevents prepack from re-running pnpm build +
          # pnpm ui:build (which would run under the 4 GB Vitest heap limit
          # and concurrently with pnpm test, potentially corrupting dist/).
          # prepare/restore mirror what prepack does: narrow CHANGELOG.md to
          # the current release section so the tarball doesn't ship the full
          # cumulative changelog (~2.4 MB). The bundled-channel smoke check
          # (runBuildSmoke in openclaw-prepack.ts) is also preserved here so
          # a patch that breaks a built channel/setup entry import is caught
          # before the tarball is uploaded.
          (
            node scripts/package-changelog.mjs prepare
            node --import tsx scripts/write-package-dist-inventory.ts
            node --import tsx scripts/test-built-bundled-channel-entry-smoke.mts

            # Bundle @openclaw/ai into the tarball and rewrite workspace:*
            # deps to exact versions. npm pack --ignore-scripts bypasses
            # prepack (which would re-run build), but prepack is also what
            # normally handles workspace deps. Without this, the tarball ships
            # with workspace:* in package.json and @openclaw/ai is not bundled,
            # so npm can't install it globally. This mirrors what upstream's
            # package-openclaw-for-docker.mts (prepareBundledAiRuntimePackage)
            # and preparePackageManifest do together.
            #
            # Save packages/ai/package.json before pnpm pack, which temporarily
            # rewrites workspace:* to resolved versions (0.0.0-private). Restore
            # immediately after so concurrent tests reading packages/ai/package.json
            # still see workspace:* values.
            cp packages/ai/package.json /tmp/ai-pkg-backup.json
            node --input-type=module -e '
              import { readFileSync, writeFileSync, mkdirSync, renameSync, rmSync, readdirSync, copyFileSync } from "node:fs";
              import { execSync } from "node:child_process";

              const pkg = JSON.parse(readFileSync("package.json", "utf8"));

              // 1. Pack packages/ai into a tarball
              execSync("pnpm --dir packages/ai pack --loglevel=error --use-stderr --pack-destination /tmp/ai-pack", {
                stdio: "inherit",
                timeout: 120000,
              });
              // 1b. Restore packages/ai/package.json — pnpm pack rewrites
              // workspace:* to 0.0.0-private in the source file temporarily.
              copyFileSync("/tmp/ai-pkg-backup.json", "packages/ai/package.json");

              // 2. Find the packed tarball
              const aiTarballs = readdirSync("/tmp/ai-pack").filter(f => f.startsWith("openclaw-ai-") && f.endsWith(".tgz"));
              if (aiTarballs.length !== 1) {
                console.error(`Expected 1 @openclaw/ai tarball, found ${aiTarballs.length}: ${aiTarballs.join(", ")}`);
                process.exit(1);
              }
              const aiTarball = `/tmp/ai-pack/${aiTarballs[0]}`;

              // 3. Extract into node_modules/@openclaw/ai/
              const aiDest = "node_modules/@openclaw/ai";
              mkdirSync(aiDest, { recursive: true });
              execSync(`tar -xzf ${aiTarball} -C ${aiDest} --strip-components=1`, {
                stdio: "inherit",
              });

              // 4. Read the staged package.json to get version + deps
              const stagedPkg = JSON.parse(readFileSync(`${aiDest}/package.json`, "utf8"));
              if (typeof stagedPkg.version !== "string" || !stagedPkg.version) {
                console.error("Packed @openclaw/ai package must declare a version");
                process.exit(1);
              }

              // 5. Hoist @openclaw/ai deps to root, strip from staged copy
              //    (root owns these — same pattern as upstream)
              for (const [name, version] of Object.entries(stagedPkg.dependencies ?? {})) {
                if (version === "0.0.0-private") continue;
                pkg.dependencies[name] = version;
              }
              delete stagedPkg.dependencies;
              writeFileSync(`${aiDest}/package.json`, JSON.stringify(stagedPkg, null, 2) + "\n");

              // 6. Set @openclaw/ai to exact version and add to bundleDependencies
              //    bundleDependencies tells npm pack to include node_modules/@openclaw/ai
              //    inside the tarball
              pkg.dependencies["@openclaw/ai"] = stagedPkg.version;
              const bundleDeps = pkg.bundleDependencies ?? [];
              if (!Array.isArray(bundleDeps)) {
                console.error("root package.json bundleDependencies must be an array when present");
                process.exit(1);
              }
              pkg.bundleDependencies = [...new Set([...bundleDeps, "@openclaw/ai"])];

              // 7. Strip workspace:* from devDependencies (preparePackageManifest does this)
              const devDeps = pkg.devDependencies;
              if (devDeps && typeof devDeps === "object") {
                const cleaned = Object.entries(devDeps).filter(([, spec]) =>
                  typeof spec !== "string" || !spec.startsWith("workspace:"));
                if (cleaned.length === 0) {
                  delete pkg.devDependencies;
                } else {
                  pkg.devDependencies = Object.fromEntries(cleaned);
                }
              }

              writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
              console.error(`Bundled @openclaw/ai@${stagedPkg.version} into node_modules and added to bundleDependencies`);
            '
            npm pack --ignore-scripts
            node scripts/package-changelog.mjs restore
            echo "tarball=$(ls openclaw-*.tgz | head -1)" >> "$GITHUB_OUTPUT"
          ) & PACK_PID=$!

          # Tests run in the foreground unless skip_tests is set.
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            echo "::notice::skip_tests is set — skipping test suite"
            TEST_EXIT=0
          else
            pnpm test
            TEST_EXIT=$?
          fi

          # Collect background job results. Failures are reported individually
          # so the log clearly identifies which of the three tasks failed.
          FAIL=$TEST_EXIT
          wait "$RELEASE_CHECK_PID" || { echo "=== FAILED: check-release-needed ===" >&2; FAIL=1; }
          wait "$PACK_PID"          || { echo "=== FAILED: npm pack ===" >&2;              FAIL=1; }
          [ "$FAIL" -eq 0 ]

      - name: Push stable branch
        if: steps.run-tests.outputs.needs_release == 'true' || inputs.force_release == true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STABLE_BRANCH="stable/${{ steps.upstream-version.outputs.version }}"
          git push --force origin "$STABLE_BRANCH"
          echo "Pushed $STABLE_BRANCH"

      - name: Tag stable build
        if: steps.run-tests.outputs.needs_release == 'true' || inputs.force_release == true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged: $TAG"

      - name: Write build fingerprint
        if: steps.run-tests.outputs.needs_release == 'true' || inputs.force_release == true
        env:
          MANIFEST_SHA256: ${{ steps.run-tests.outputs.manifest_sha256 }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          OUTPUT_PATH: bf-build-fingerprint.json
        run: /tmp/bf-build-stable/write-build-fingerprint.sh

      - name: Create GitHub Release
        if: steps.run-tests.outputs.needs_release == 'true' || inputs.force_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Brightfire ${{ steps.version.outputs.version }}"
          target_commitish: stable/${{ steps.upstream-version.outputs.version }}
          draft: false
          files: |
            ${{ steps.run-tests.outputs.tarball }}
            bf-build-fingerprint.json
