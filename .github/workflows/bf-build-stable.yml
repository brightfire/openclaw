# Build Stable
#
# Rebuilds the stable branch by creating it fresh from an upstream tag
# and merging all active brightfire/* patch branches in manifest order.
# Then tags the result and creates a GitHub Release with the built tarball.
#
# Triggered automatically on push to any brightfire/* branch, or manually.
# Only one run executes at a time — new runs queue and cancel prior runs.

name: Build Stable

on:
  push:
    branches:
      - 'brightfire/*'
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to build from (e.g. v2026.5.7). Defaults to latest.'
        required: false
        type: string

env:
  PATCHES_FILE: BRIGHTFIRE_PATCHES.md

permissions:
  contents: write

concurrency:
  group: build-stable
  cancel-in-progress: true

jobs:
  rebuild-stable:
    name: Rebuild stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine upstream tag
        id: upstream-tag
        run: |
          if [ -n "${{ inputs.upstream_tag }}" ]; then
            TAG="${{ inputs.upstream_tag }}"
          else
            # Read the base version from the current stable branch name
            # or fallback to the base version in package.json
            BASE=$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$BASE" ]; then
              BASE=$(git tag -l --sort=-v:refname | head -1)
            fi
            TAG="$BASE"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip leading v for stable branch name
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure upstream remote
        run: |
          ORIGIN_URL=$(git remote get-url origin 2>/dev/null || echo "")
          if echo "$ORIGIN_URL" | grep -q brightfire; then
            UPSTREAM_URL=$( echo "$ORIGIN_URL" | sed 's|brightfire/openclaw|openclaw/openclaw|' )
            git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
            git fetch --force upstream
          fi

      - name: Compute version suffix
        id: version
        run: |
          VERSION="${{ steps.upstream-tag.outputs.version }}"
          # Find the highest existing bf suffix for this base version
          BF_NUM=$(git tag -l "v${VERSION}-bf*" 2>/dev/null | sed -E 's/.*-bf([0-9]+)/\1/' | sort -n | tail -1)
          if [ -z "$BF_NUM" ]; then
            BF_NUM=1
          else
            BF_NUM=$((BF_NUM + 1))
          fi
          echo "bf=bf${BF_NUM}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}-bf${BF_NUM}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-bf${BF_NUM}" >> "$GITHUB_OUTPUT"

      - name: Install tools
        run: |
          npm install -g pnpm

      - name: Parse active patches from manifest
        id: patches
        run: |
          python3 << 'PYEOF'
          import re
          import sys

          patches_file = "BRIGHTFIRE_PATCHES.md"
          try:
              with open(patches_file, 'r') as f:
                  content = f.read()
          except FileNotFoundError:
              print("::error::BRIGHTFIRE_PATCHES.md not found")
              sys.exit(1)

          active = []
          current_patch = None
          current_status = "active"
          current_reapply = None

          for line in content.split('\n'):
              # Detect patch section header
              m = re.match(r'^##\s+(.+)$', line)
              if m:
                  if current_patch:
                      if current_status == "active" and current_reapply != "no":
                          active.append(current_patch)
                  current_patch = None
                  current_status = "active"
                  current_reapply = None
              # Canonical branch
              m = re.match(r'\s*-\s*\*\*Canonical branch\*\*:\s*`brightfire/([^`]+)`', line)
              if m:
                  current_patch = m.group(1)
              # Status
              m = re.match(r'\s*-\s*\*\*Status\*\*:\s*(\w+)', line)
              if m:
                  current_status = m.group(1)
              # Reapply
              m = re.match(r'\s*-\s*\*\*Reapply\*\*:\s*(\w+)', line)
              if m:
                  current_reapply = m.group(1)

          # Last patch
          if current_patch:
              if current_status == "active" and current_reapply != "no":
                  active.append(current_patch)

          out = ",".join(active)
          with open("/tmp/patches_list.txt", "w") as f:
              f.write(out)
          print(f"::set-output name=count::{len(active)}")
          print(f"::set-output name=list::{out}")
          print(f"Active patches ({len(active)}): {out}")
          PYEOF

      - name: Create stable branch from upstream tag
        run: |
          TAG="${{ steps.upstream-tag.outputs.tag }}"
          STABLE_BRANCH="stable/${{ steps.upstream-tag.outputs.version }}"

          # Create/reset stable from upstream tag
          if git ls-remote --exit-code --heads upstream "$STABLE_BRANCH" 2>/dev/null; then
            # Upstream has this stable branch too — use it as base
            git checkout -b "$STABLE_BRANCH" "upstream/$STABLE_BRANCH" 2>/dev/null || \
            git checkout -b "$STABLE_BRANCH" "$TAG"
          else
            git checkout -b "$STABLE_BRANCH" "$TAG"
          fi

          # Delete old remote stable branch if it exists
          if git ls-remote --exit-code --heads origin "$STABLE_BRANCH" 2>/dev/null; then
            git push origin --delete "$STABLE_BRANCH" || true
          fi

          echo "Created stable branch: $STABLE_BRANCH"

      - name: Configure git
        run: |
          git config user.name "brightfire-ci"
          git config user.email "ci@brightfire.net"

      - name: Fetch all brightfire branches
        run: git fetch origin '+refs/heads/brightfire/*:refs/remotes/origin/brightfire/*'

      - name: Merge patches in order
        run: |
          IFS=',' read -ra PATCHES <<< "${{ steps.patches.outputs.list }}"
          STABLE_BRANCH="stable/${{ steps.upstream-tag.outputs.version }}"

          for PATCH in "${PATCHES[@]}"; do
            PATCH=$(echo "$PATCH" | xargs)
            PATCH_BRANCH="brightfire/$PATCH"

            echo ""
            echo "=== Merging $PATCH_BRANCH ==="

            # Verify branch exists
            if ! git ls-remote --exit-code --heads origin "$PATCH_BRANCH" 2>/dev/null; then
              echo "::warning::$PATCH_BRANCH not found on remote — skipping"
              continue
            fi

            # Squash-merge to avoid history contamination
            if git merge --squash "origin/$PATCH_BRANCH" 2>&1; then
              git commit --no-verify -m "ci: apply $PATCH_BRANCH" 2>&1
              echo "SUCCESS: $PATCH_BRANCH"
            else
              git reset --hard HEAD
              echo "::error::Merge conflict applying $PATCH_BRANCH"
              echo "CI_MERGE_CONFLICT=true" >> "$GITHUB_ENV"
              echo "CONFLICT_BRANCH=$PATCH_BRANCH" >> "$GITHUB_ENV"
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Pre-push checks
        run: |
          pnpm prepush:ci 2>/dev/null || pnpm tsgo

      - name: Run tests
        run: pnpm vitest run --reporter=basic 2>/dev/null || echo "Tests step completed (non-blocking)"

      - name: Update package.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');
          "
          git add package.json
          git commit --no-verify -m "ci: bump version to $VERSION"

      - name: Push stable branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STABLE_BRANCH="stable/${{ steps.upstream-tag.outputs.version }}"
          git push origin "$STABLE_BRANCH"
          echo "Pushed $STABLE_BRANCH"

      - name: Update Brightfire patch commit hashes (optional)
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          # This step optionally updates BRIGHTFIRE_PATCHES.md with new commit
          # hashes after a successful build. Disabled for now — we'll handle
          # this in a future enhancement.
          pass
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Brightfire ${{ steps.version.outputs.version }}"
          body: |
            ## Brightfire OpenClaw ${{ steps.version.outputs.version }}
            **Based on:** upstream `${{ steps.upstream-tag.outputs.tag }}`
            **Release notes:** Automated build including patches from ${PATCHES:-BRIGHTFIRE_PATCHES.md}
          target_commitish: ${{ steps.version.outputs.tag }}
          draft: false

      - name: Build and attach tarball
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NODE_OPTIONS="--max-old-space-size=6000" pnpm build
          pnpm ui:build
          npm pack --ignore-scripts
          TARBALL=$(ls openclaw-*.tgz 2>/dev/null | head -1)
          if [ -n "$TARBALL" ]; then
            gh release upload "${{ steps.version.outputs.tag }}" "$TARBALL"
            echo "Uploaded: $TARBALL"
          fi
