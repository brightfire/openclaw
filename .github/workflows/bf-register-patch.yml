# Register Patch
#
# Triggered when a PR merges into any patch branch (brightfire/* or <base-commit>/*).
# Updates BRIGHTFIRE_PATCHES.md on brightfire/ci directly:
#   - NEW patches: appends a full manifest entry
#   - EXISTING patches: updates the squashed commit SHA and source PR number
#   - workflow_dispatch with refresh_branch_heads=true: bulk-refreshes
#     Branch HEAD for every active patch via git ls-remote (Source PR
#     preserved)
#
# All manifest mutation is owned by scripts/bf/update-patch-entry.py. This
# workflow is a thin caller: it shapes the CLI args, runs git config /
# commit / push, and lets the script decide what (if anything) to write.
#
# Pushing to brightfire/ci always triggers BF: Build Stable (which watches
# that branch), so every merged patch PR results in a stable rebuild.

name: "BF: Register Patch"

on:
  pull_request_target:
    types: [closed]
    branches:
      - "brightfire/*"
      - "**/*" # Catch <base-commit>/<patch> branches that don't match brightfire/*
  workflow_dispatch:
    inputs:
      refresh_branch_heads:
        description: "Bulk-refresh mode: refresh Branch HEAD commit for ALL active patches in the manifest via git ls-remote against origin (no local fetch). Source PR is left untouched per entry. One commit, one push. Ignores patch_branch / pr_number / pr_title. Use after a catch-up batch."
        required: false
        type: boolean
        default: false
      patch_branch:
        description: "Patch branch (e.g. brightfire/sessions-history-archived). Ignored when refresh_branch_heads=true."
        required: false
        type: string
      pr_number:
        description: "Source PR ref. Accepts a bare number (`24`), a `#N` form (`#24`), or a full URL (`https://github.com/brightfire/openclaw/pull/24`). Bare/`#N` defaults to the Brightfire fork (`brightfire/openclaw`). For cross-repo refs (e.g. upstream `openclaw/openclaw`) pass the full URL. Leave EMPTY (or `0`/`#0`) to preserve the existing Source PR (use for catch-up syncs). Ignored when refresh_branch_heads=true."
        required: false
        type: string
      pr_title:
        description: "PR title (used for new entries). Ignored when refresh_branch_heads=true."
        required: false
        type: string
        default: "Manual registration"

permissions:
  contents: write
  pull-requests: write

jobs:
  register:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref != 'brightfire/ci' &&
      github.event.pull_request.base.ref != 'main' &&
      !startsWith(github.event.pull_request.base.ref, 'stable/') &&
      !startsWith(github.event.pull_request.base.ref, 'feature/') &&
      !startsWith(github.event.pull_request.base.ref, 'fix/'))
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.BF_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.BF_CI_APP_PRIVATE_KEY }}

      - name: Checkout brightfire/ci
        uses: actions/checkout@v5
        with:
          ref: brightfire/ci
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Update patch manifest
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REFRESH_BRANCH_HEADS: ${{ inputs.refresh_branch_heads }}
          PATCH_BRANCH: ${{ inputs.patch_branch || github.event.pull_request.base.ref }}
          PR_TITLE: ${{ inputs.pr_title || github.event.pull_request.title }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
        run: |
          set -euo pipefail
          git config user.name "brightfire-ci"
          git config user.email "ci@brightfire.net"

          if [ "$REFRESH_BRANCH_HEADS" = "true" ]; then
            python3 scripts/bf/update-patch-entry.py \
              -f BRIGHTFIRE_PATCHES.md --refresh --all
          else
            PATCH_NAME="${PATCH_BRANCH#brightfire/}"
            ARGS=(-f BRIGHTFIRE_PATCHES.md --patch "$PATCH_NAME")
            # On a merged PR_TARGET event MERGE_SHA is authoritative; on a
            # manual workflow_dispatch it's empty and the script falls back
            # to `git ls-remote origin refs/heads/brightfire/<patch>`.
            if [ -n "$MERGE_SHA" ]; then
              ARGS+=(--commit-sha "${MERGE_SHA:0:10}")
            fi
            if [ -n "$PR_NUMBER" ]; then
              ARGS+=(--pr "$PR_NUMBER")
            fi
            if [ -n "$PR_TITLE" ]; then
              ARGS+=(--pr-title "$PR_TITLE")
            fi
            python3 scripts/bf/update-patch-entry.py "${ARGS[@]}"
          fi

          git add BRIGHTFIRE_PATCHES.md
          if git diff --cached --quiet; then
            echo "No manifest changes; skipping push."
            exit 0
          fi
          git commit -m "ci: update patch manifest"
          git push origin brightfire/ci
