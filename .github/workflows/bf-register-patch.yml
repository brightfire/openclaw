# Register Patch
#
# Triggered when a PR merges into any brightfire/* branch.
# Updates BRIGHTFIRE_PATCHES.md on brightfire/ci directly:
#   - NEW patches: appends a full manifest entry
#   - EXISTING patches: updates the squashed commit SHA and source PR number
#
# Pushing to brightfire/ci always triggers BF: Build Stable (which watches
# that branch), so every merged patch PR results in a stable rebuild.

name: "BF: Register Patch"

on:
  pull_request_target:
    types: [closed]
    branches:
      - 'brightfire/*'
  workflow_dispatch:
    inputs:
      patch_branch:
        description: 'Patch branch (e.g. brightfire/sessions-history-archived)'
        required: true
        type: string
      pr_number:
        description: 'Source PR number'
        required: true
        type: string
      pr_title:
        description: 'PR title (used for new entries)'
        required: false
        type: string
        default: 'Manual registration'

permissions:
  contents: write
  pull-requests: write

jobs:
  register:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.base.ref, 'brightfire/'))
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.BF_CI_APP_ID }}
          private-key: ${{ secrets.BF_CI_APP_PRIVATE_KEY }}

      - name: Checkout brightfire/ci
        uses: actions/checkout@v4
        with:
          ref: brightfire/ci
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Update patch manifest
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PATCH_BRANCH: ${{ inputs.patch_branch || github.event.pull_request.base.ref }}
          PR_TITLE: ${{ inputs.pr_title || github.event.pull_request.title }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          PATCHES_FILE="BRIGHTFIRE_PATCHES.md"

          # Resolve the commit SHA:
          # - PR event: use the merge commit SHA
          # - Manual dispatch: resolve HEAD of the patch branch from git
          if [ -n "$MERGE_SHA" ]; then
            RAW_SHA="$MERGE_SHA"
          else
            git fetch origin "$PATCH_BRANCH" 2>/dev/null || true
            RAW_SHA=$(git rev-parse "origin/$PATCH_BRANCH" 2>/dev/null || echo "$HEAD_SHA")
          fi
          COMMIT_SHORT="${RAW_SHA:0:10}"

          # Extract patch name from branch (strip brightfire/ prefix)
          PATCH_NAME=$(echo "$PATCH_BRANCH" | sed 's|^brightfire/||')

          git config user.name "brightfire-ci"
          git config user.email "ci@brightfire.net"

          if grep -q "brightfire/${PATCH_NAME}" "$PATCHES_FILE"; then
            # ----------------------------------------------------------------
            # EXISTING PATCH — update commit SHA, source PR, and last-updated
            # ----------------------------------------------------------------
            echo "Existing patch detected: $PATCH_NAME — updating entry"

            python3 scripts/bf/update-patch-entry.py "$PATCHES_FILE" "$PATCH_NAME" "$COMMIT_SHORT" "$PR_NUMBER"

            git add "$PATCHES_FILE"
            git commit -m "ci: update patch entry for brightfire/${PATCH_NAME} (PR #${PR_NUMBER}, ${COMMIT_SHORT})"

          else
            # ----------------------------------------------------------------
            # NEW PATCH — append a full manifest entry
            # ----------------------------------------------------------------
            echo "New patch detected: $PATCH_NAME — creating entry"

            # Strip common conventional commit prefixes from the PR title
            TITLE=$(echo "$PR_TITLE" | sed 's/^feat\s*:\s*//; s/^fix\s*:\s*//; s/^doc\s*:\s*//; s/^docs\s*:\s*//')

            {
              echo ""
              echo "## $TITLE"
              echo ""
              echo "- **Status:** active"
              echo "- **Reapply:** yes"
              echo "- **Stable branch first merged into:** TBD"
              echo "- **Canonical branch:** \`brightfire/${PATCH_NAME}\`"
              echo "- **Branch HEAD commit:** \`${COMMIT_SHORT}\`"
              echo "- **Source PR:** #${PR_NUMBER}"
              echo ""
              echo "### Rationale"
              echo ""
              echo "_Add description of what this patch does and why._"
              echo ""
              echo "### Files touched"
              echo ""
              echo "TBD — update after first stable merge"
              echo ""
              echo "### Upgrade guidance"
              echo ""
              echo "_Add known conflict notes or \`git cherry-pick\` command here._"
            } >> "$PATCHES_FILE"

            git add "$PATCHES_FILE"
            git commit -m "ci: register new patch brightfire/${PATCH_NAME} (PR #${PR_NUMBER})"
          fi

          # Always push to brightfire/ci — this triggers BF: Build Stable
          git push origin brightfire/ci
          echo "Pushed updated manifest to brightfire/ci"
