# Register Patch
#
# Triggered when a PR merges into any brightfire/* branch.
# If the branch is not yet listed in BRIGHTFIRE_PATCHES.md, opens a PR to add it.
# This ensures every patch branch has a manifest entry for the upgrade replay process.

name: Register Patch

on:
  pull_request_target:
    types: [closed]
    branches:
      - 'brightfire/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  register:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.base.ref, 'brightfire/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and register patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATCHES_FILE="BRIGHTFIRE_PATCHES.md"

          # Extract patch name from branch (strip brightfire/ prefix)
          PATCH_NAME=$(echo "$PATCH_BRANCH" | sed 's|^brightfire/||')

          # Check if already registered
          if grep -q "brightfire/${PATCH_NAME}" "$PATCHES_FILE"; then
            echo "Patch already registered in manifest — nothing to do"
            exit 0
          fi

          echo "New patch detected: $PATCH_NAME"

          # Generate the manifest entry
          TITLE=$(echo "$PR_TITLE" | sed 's/^feat\s*:\s*//; s/^fix\s*:\s*//; s/^doc\s*:\s*//;')
          ENTRY="
          ## $TITLE

          - **Status:** active
          - **Reapply:** yes
          - **Stable branch first merged into:** TBD
          - **Commit on stable:** TBD
          - **Canonical branch:** \`brightfire/${PATCH_NAME}\`
          - **Squashed commit (source):** TBD
          - **Source PR:** #${{ github.event.pull_request.number }}

          ### Rationale

          _Add description of what this patch does and why._

          ### Files touched

          TBD — update after first stable merge

          ### Upgrade guidance

          _Add known conflict notes or \`git merge\` command here._
          "

          # Branch, edit manifest, push
          MANIFEST_BRANCH="manifest/add-${PATCH_NAME}"
          git config user.name "brightfire-ci"
          git config user.email "ci@brightfire.net"

          git checkout -b "$MANIFEST_BRANCH"

          # Append to the end of BRIGHTFIRE_PATCHES.md
          echo "$ENTRY" >> "$PATCHES_FILE"

          git add "$PATCHES_FILE"
          git commit -m "ci: add patch registry entry for brightfire/${PATCH_NAME}"
          git push origin "$MANIFEST_BRANCH"

          # Open PR
          PR_URL=$(gh api -X POST repos/${{ github.repository }}/pulls \
            -f title="ci: register patch $PATCH_NAME in BRIGHTFIRE_PATCHES.md" \
            -f body="Auto-generated patch registry entry for \`brightfire/${PATCH_NAME}\`. Please fill in the rationale, files touched, and upgrade guidance." \
            -f head="$MANIFEST_BRANCH" \
            -f base="stable/v2026.5.7" \
            | jq -r .html_url)

          echo "Opened PR: $PR_URL"
